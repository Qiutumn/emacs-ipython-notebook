name: CI

on:
  pull_request:
    paths-ignore:
    - '**.md'
    - '**.rst'
  push:
    paths-ignore:
    - '**.md'
    - '**.rst'
    branches-ignore:
    - 'master'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        emacs_version: [27.2, 28.2, 29.1]
        python-version: [3.8]

    steps:
    - uses: actions/checkout@v4

    - name: python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: nix
      uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: actions/cache@v4
      id: cache-cask-packages
      with:
        path: .cask
        key: cache-cask-packages-001

    - uses: actions/cache@v4
      id: cache-cask-executable
      with:
        path: ~/.cask
        key: cache-cask-executable-001

    - uses: cask/setup-cask@master
      if: steps.cache-cask-executable.outputs.cache-hit != 'true'
      with:
          version: snapshot

    - name: paths
      run: |
        echo "$HOME/.cask/bin" >> $GITHUB_PATH

    - name: apt-get
      if: startsWith(runner.os, 'disable')
      run: |
        sudo apt-get -yq update
        DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install gnutls-bin sharutils nodejs gfortran gnupg2 dirmngr libreadline-dev libcurl4-openssl-dev texlive-latex-base libfuse-dev libxml2-dev libssl-dev libzmq3-dev jupyter-core jupyter-client

    - name: test-mem-constrained
      run: |
        pip install yq
        make quick
      continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Emacs 30.2
      uses: jcs090218/setup-emacs@master
      with:
        version: 30.2

    - name: Install Jupyter
      shell: pwsh
      run: python -m pip install "jupyter-server>=2,<3" "nbformat>=5,<6" ipykernel

    - name: Install Emacs test dependencies
      shell: pwsh
      run: emacs --batch -Q -l test/install-test-dependencies.el

    - name: Unit tests
      shell: pwsh
      run: emacs --batch -Q -l test/run-unit-tests.el

    - name: Native Windows Jupyter integration
      shell: pwsh
      run: |
        $env:EIN_TEST_PYTHON = (Get-Command python).Source
        emacs --batch -Q -l test/windows-integration.el
